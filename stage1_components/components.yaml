relations:
  left_of:
    label:
      ko: 왼쪽에 있다
      en: to the left of
    kind: spatial
    arity: 2
    definition: 주체의 가시 영역이 대상의 가시 영역보다 완전히 왼쪽에 있다.
    role_selectors:
      subject:
        any_entity: true
      object:
        any_entity: true
    review_tier: core
    inverse: right_of
  right_of:
    label:
      ko: 오른쪽에 있다
      en: to the right of
    kind: spatial
    arity: 2
    definition: 주체의 가시 영역이 대상의 가시 영역보다 완전히 오른쪽에 있다.
    role_selectors:
      subject:
        any_entity: true
      object:
        any_entity: true
    review_tier: core
    inverse: left_of
  'on':
    label:
      ko: 표면에 놓여 있다
      en: resting on
    kind: spatial
    arity: 2
    definition: 대상의 윗면과 접촉하고 지지된다. 사람은 가구에 앉거나 보드에 선 자세도 가능하나 단순 화면 위쪽과 구별한다.
    role_selectors:
      subject:
        any_entity: true
      object:
        capabilities_any:
        - support_surface
    review_tier: core
  inside:
    label:
      ko: 안에 있다
      en: inside
    kind: spatial
    arity: 2
    definition: 용기의 내부에 있고 물체의 수·속성·포함 관계가 보인다. 열린 용기 또는 투명 용기가 필요하다.
    role_selectors:
      subject:
        any_entity: true
      object:
        capabilities_any:
        - container
    review_tier: core
    requirements:
    - visible_contents
    - compatible_container_size
  under:
    label:
      ko: 아래에 들어가 있다
      en: under
    kind: spatial
    arity: 2
    definition: 대상의 바닥 아래 공간에 주체가 있으며 가시 영역이 수평으로 일부 겹친다. 윗면 지지와 다르다.
    role_selectors:
      subject:
        any_entity: true
      object:
        categories:
        - table
        - desk
        - chair
        - bench
        - shelf
    review_tier: review_required
  above:
    label:
      ko: 화면상 위쪽에 있다
      en: above
    kind: spatial
    arity: 2
    definition: 화면의 세로 방향 관계. 표면 접촉·지지나 중력 방향을 자동으로 함의하지 않는다.
    role_selectors:
      subject:
        any_entity: true
      object:
        any_entity: true
    review_tier: core
    inverse: below
  below:
    label:
      ko: 화면상 아래쪽에 있다
      en: below
    kind: spatial
    arity: 2
    definition: 화면의 세로 방향 관계. 표면 접촉·지지나 중력 방향을 자동으로 함의하지 않는다.
    role_selectors:
      subject:
        any_entity: true
      object:
        any_entity: true
    review_tier: core
    inverse: above
  in_front_of:
    label:
      ko: 앞에 있다
      en: in front of
    kind: spatial
    arity: 2
    definition: 앞뒤 깊이 관계. 화면 위아래와 구별하며 핵심 개체의 판별을 가리지 않는다.
    role_selectors:
      subject:
        any_entity: true
      object:
        any_entity: true
    review_tier: review_required
    inverse: behind
    requirements:
    - depth_cues_visible
    - all_arguments_visible
  behind:
    label:
      ko: 뒤에 있다
      en: behind
    kind: spatial
    arity: 2
    definition: 앞뒤 깊이 관계. 화면 위아래와 구별하며 핵심 개체의 판별을 가리지 않는다.
    role_selectors:
      subject:
        any_entity: true
      object:
        any_entity: true
    review_tier: review_required
    inverse: in_front_of
    requirements:
    - depth_cues_visible
    - all_arguments_visible
  next_to:
    label:
      ko: 바로 옆에 있다
      en: next to
    kind: spatial
    arity: 2
    definition: 서로 떨어져 바로 옆에 있으며 지정한 다른 개체가 사이에 없다. 이 두 개체 사이에 포함, 지지, 들기, 착용, 탑승을 함께 부여하지 않는다.
    role_selectors:
      subject:
        any_entity: true
      object:
        any_entity: true
    review_tier: core
    symmetric: true
  touching:
    label:
      ko: 서로 닿아 있다
      en: touching
    kind: spatial
    arity: 2
    definition: 두 개체의 표면 접촉이 보인다. 단순한 근접과 구별한다.
    role_selectors:
      subject:
        any_entity: true
      object:
        any_entity: true
    review_tier: review_required
    symmetric: true
  leaning_against:
    label:
      ko: 기대어 있다
      en: leaning against
    kind: spatial
    arity: 2
    definition: 주체가 기울어진 채 대상에 접촉해 지지된다.
    role_selectors:
      subject:
        capabilities_any:
        - leanable
      object:
        capabilities_any:
        - leaning_support
    review_tier: review_required
  hanging_from:
    label:
      ko: 매달려 있다
      en: hanging from
    kind: spatial
    arity: 2
    definition: 주체가 대상으로부터 매달려 지지되며 연결부가 보인다.

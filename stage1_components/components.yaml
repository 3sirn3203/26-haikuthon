    definition: 사람이 손으로 대상 물체를 잡아 들고 있다.
    role_selectors:
      subject:
        capabilities_any:
        - human
      object:
        capabilities_any:
        - portable
    review_tier: core
    requirements:
    - singleton_arguments
    - hands_and_object_visible
  wearing:
    label:
      ko: 착용하고 있다
      en: wearing
    kind: action
    arity: 2
    definition: 사람이 물품을 몸에 착용하고 있다. 손에 들고 있는 상태와 구별한다.
    role_selectors:
      subject:
        capabilities_any:
        - human
      object:
        capabilities_any:
        - wearable_core
    review_tier: core
    requirements:
    - singleton_arguments
    - worn_item_visible
  riding:
    label:
      ko: 올라앉아 타고 있다
      en: riding
    kind: action
    arity: 2
    definition: 사람이 탈것 또는 탑승 가능한 동물 위에 앉은 탑승 자세다. 옆에 서 있거나 교통수단 내부에 가려진 승객은 제외한다.
    role_selectors:
      subject:
        capabilities_any:
        - human
      object:
        capabilities_any:
        - rideable
    review_tier: core
    requirements:
    - singleton_arguments
    - subject_sitting
    - rider_and_mount_visible
  pushing:
    label:
      ko: 미는 자세다
      en: in a pushing posture with
    kind: action
    arity: 2
    definition: 사람이 대상 손잡이에 손을 대고 미는 자세를 보인다. 실제 이동 속도를 판단하지 않는다.
    role_selectors:
      subject:
        capabilities_any:
        - human
      object:
        capabilities_any:
        - pushable
    review_tier: review_required
    requirements:
    - singleton_arguments
    - hands_and_handle_visible
  pulling:
    label:
      ko: 당기는 자세다
      en: in a pulling posture with
    kind: action
    arity: 2
    definition: 사람이 대상 손잡이를 잡아 당기는 자세를 보인다. 미는 자세와 구별 가능해야 한다.
    role_selectors:
      subject:
        capabilities_any:
        - human
      object:
        capabilities_any:
        - pullable
    review_tier: review_required
    requirements:
    - singleton_arguments
    - hands_and_handle_visible
  reading:
    label:
      ko: 펼친 책을 읽는 자세다
      en: reading
    kind: action
    arity: 2
    definition: 사람이 펼친 책·노트를 바라보는 독서 자세다. 글자 내용은 지정하지 않는다.
    role_selectors:
      subject:
        capabilities_any:
        - human
      object:
        capabilities_any:
        - readable
    review_tier: review_required
    requirements:
    - singleton_arguments
    - object_open
    - gaze_and_book_visible
  hugging:
    label:
      ko: 팔로 감싸 안고 있다
      en: hugging
    kind: action
    arity: 2
    definition: 사람이 다른 사람 또는 동물을 팔로 감싸 안은 정지 자세다.
    role_selectors:
      subject:
        capabilities_any:
        - human
      object:
        capabilities_any:
        - human
        - animal
    review_tier: review_required
    requirements:
    - singleton_arguments
    - contact_visible
  playing:
    label:
      ko: 악기를 연주하는 자세다
      en: playing
    kind: action
    arity: 2
    definition: 사람이 악기별 연주 자세를 보인다. 소리가 난다고 판단하지 않는다.
    role_selectors:
      subject:
        capabilities_any:
        - human
      object:
        capabilities_any:
        - instrument
    review_tier: review_required
    requirements:
    - singleton_arguments
    - instrument_specific_pose
  between:
    label:
      ko: 두 개체 사이에 있다
      en: between
    kind: spatial
    arity: 3
    definition: 가로 순서가 reference_a–subject–reference_b 또는 그 역순이다. 세 역할은 서로
      다른 단일 entity ID를 참조한다.
    role_selectors:
      subject:
        any_entity: true
      reference_a:
        any_entity: true
      reference_b:
        any_entity: true
    requirements:
    - singleton_arguments
    - distinct_role_ids
    review_tier: review_required
    scene_encoding: 'roles: {subject: entity_id, reference_a: entity_id, reference_b:
      entity_id}; binary object 필드로 압축하지 않는다.'

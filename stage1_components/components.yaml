# Shared, editable source registry for both train and test.
version: 1.0.0
description: Shared component pool for both train and test; no split-specific object
  definitions.
domains:
  tableware:
    label:
      ko: 식기와 주방 도구
      en: tableware and kitchenware
  food:
    label:
      ko: 빵과 조리 음식
      en: bakery and prepared food
  produce:
    label:
      ko: 과일과 채소
      en: fruit and vegetables
  tools:
    label:
      ko: 작업 도구
      en: hand tools and workshop objects
  stationery:
    label:
      ko: 문구와 책
      en: stationery and books
  toys_shapes:
    label:
      ko: 장난감과 입체 도형
      en: toys and geometric solids
  clothing_accessories:
    label:
      ko: 의류와 휴대용품
      en: clothing and accessories
  furniture_interior:
    label:
      ko: 가구와 실내 소품
      en: furniture and interior objects
  animals_pets:
    label:
      ko: 반려동물과 소동물
      en: pets and small animals
  animals_farm_wild:
    label:
      ko: 농장 동물과 야생동물
      en: farm animals and wildlife
  plants_garden:
    label:
      ko: 식물과 원예
      en: plants and gardening
  sports_outdoors:
    label:
      ko: 스포츠와 야외 활동
      en: sports and outdoor equipment
  vehicles_transport:
    label:
      ko: 교통수단과 운반
      en: vehicles and transport
  people_daily:
    label:
      ko: 사람의 일상 활동과 기기
      en: people, daily activities and devices
capabilities:
  human:
    definition: 사람 개체. 직업·성별·나이 등 미지정 세부 정보는 추가하지 않는다.
  animal:
    definition: 사람을 제외한 동물.
  plant:
    definition: 식물 개체.
  portable:
    definition: 한 사람이 손으로 들어 표현할 수 있는 크기의 물체.
  container:
    definition: 내용물을 넣을 수 있는 용기. 실제 들어갈 수 있는 크기는 장면에서 별도 검사.
  openable:
    definition: 열림/닫힘을 시각적으로 구별할 수 있음.
  support_surface:
    definition: 다른 물체를 올려 지지하는 표면.
  seating:
    definition: 사람이나 동물이 앉을 수 있는 가구.
  wearable:
    definition: 사람이 몸에 착용할 수 있는 물품.
  wearable_core:
    definition: 초기 wearing에 사용할 단일 모자·헬멧·스카프·배낭.
  rideable:
    definition: 사람이 위에 올라앉는 탑승 자세를 표현할 수 있음.
  pushable:
    definition: 손잡이 또는 프레임에 손을 대고 미는 자세를 표현할 수 있음.
  pullable:
    definition: 손잡이를 잡아 당기는 자세를 표현할 수 있음.
  readable:
    definition: 펼친 상태에서 읽는 자세를 표현할 수 있는 책·노트.
  instrument:
    definition: playing 자세의 대상인 악기.
  hangable:
    definition: 매달린 상태를 표현할 수 있음.
  hanging_support:
    definition: 물체를 매달아 지지할 수 있는 구조.
  leanable:
    definition: 면이나 긴 몸체를 기대어 놓을 수 있음.
  leaning_support:
    definition: 기대는 물체를 지지할 수 있는 면.
  vehicle:
    definition: 교통수단.
  large_subject:
    definition: 작은 실내 공간과 충돌하거나 wide 구도가 필요한 큰 대상.
  food:
    definition: 먹을 수 있는 개체. 정확한 count는 완성된 하나의 단위로 센다.
count:
  type: integer
  allowed_values:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  default_values:
  - 1
  - 2
  - 3
  - 4
  review_required_values:
  - 5
  - 6
  definition: 그룹별 정확한 수. category 전체 수는 서로 구별되는 그룹의 합. 신발·장갑은 개별 한 짝, 선글라스는 완성된 한
    개.

# 데이터 경로. 하드코딩 금지: 아래 값은 환경변수로 override한다.
#   HAIKU_DATA_ROOT   이미지 데이터 루트 (기본: 레포 루트의 data/, data/.gitignore가 자기 자신을 무시)
#   HAIKU_CACHE_DIR   임베딩/예측 캐시 (기본 baselines/chan_lee/cache)
#   HAIKU_PUBLIC_IDS  Public 문항 id 목록 파일 (줄당 test id 1개)
# 상대 경로는 모두 레포 루트 기준. images 패턴은 data_root 기준.
data_root: ${HAIKU_DATA_ROOT:-data}
cache_dir: ${HAIKU_CACHE_DIR:-baselines/chan_lee/cache}

prompts:
  train: outputs_stage2/train_prompts_v2.jsonl        # stage3 입력과 동일
  test: outputs_stage2/test_prompts_v2.jsonl
  train_hn: outputs_stage2/train_prompts_variants.jsonl   # 참가자에게는 비공개 (L3/분석용만)
  test_hn: outputs_stage2/test_prompts_variants.jsonl
components:
  train: outputs_stage1/train_components.jsonl
  test: outputs_stage1/test_components.jsonl

# 데이터 패키지: <data_root>/<package>/{prompts.jsonl, images/**/*.png}
# prompts.jsonl 행은 {"id", "prompts"}이고, HN 행은 "prompts": "hard_negative". 이미지 파일명 = 행 id.
packages:
  train: train_v1
  test: test_v1

# Public/Private 결정 순서:
#   1) public_ids 파일(공식)  2) scripts/pair_hn.py로 복원한 HN 출처에서 "HN이 없는 문항"
#   3) 잠정 규칙: stage1 '기준' 800문항 + 묶음 문항 중 seed로 뽑은 200문항
public_ids: ${HAIKU_PUBLIC_IDS:-}
public_size: 1000
split_seed: 20261111
val_size: 500
val_hn_target: 250   # val 후보 풀에 넣을 train HN 수 목표 (나머지 HN은 B2(b) 학습용)

exp_id: ichan_jung/b1_pickscore_zs
category: honest
method: 'B1 zero-shot dual encoder: PickScore v1 (CLIP-H/14); cosine similarity over
  the full pool; evaluated on the HAIKUTHON submission site'
eval_split: test_full
retriever:
  type: pure_torch_clip            # submission/model.py (transformers 미사용)
  model: yuvalkirstain/PickScore_v1
  tokenizer: laion/CLIP-ViT-H-14-laion2B-s32B-b79K   # vocab.json, merges.txt
  precision: fp16
  image_size: 224                  # shortest-edge bicubic resize + center crop
  text_max_tokens: 77              # 초과 시 잘림
  batch_size: 64
  num_workers: 4                   # 평가 서버 CPU 4코어
  matching: none                   # 문항별 독립 Top-5
submission:
  build: python export_submission.py --model pickscore --out build/pickscore
  zip_files: [model.py, model.safetensors, clip_config.json, vocab.json, merges.txt]
  zip_bytes: 1973729186
  zip_sha256_prefix: 54775636ab5f49fc
  extra_dependencies: none         # torch/safetensors/numpy/pillow만 사용
environment:
  device: cuda:L4                  # 제출 사이트 GPU (24GB), CPU 4, RAM 16GiB

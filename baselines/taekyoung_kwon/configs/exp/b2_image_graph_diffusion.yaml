exp_id: taekyoung_kwon/b2_image_graph_diffusion
category: honest
method: "B2 query-wise image-pool graph diffusion over SigLIP2 cosine scores"
eval_split: test
include_hn: true
uses_train_finetune: false
uses_train_hard_negatives: false
violates_cross_query_rule: false
use_cache: false
retriever:
  type: openclip
  model: ViT-SO400M-16-SigLIP2-384
  pretrained: webli
  precision: fp16
  batch_size: 32
  num_workers: 8
postprocess:
  type: image_graph_diffusion
  k: 10
  temperature: 0.07
  alpha: 0.15
  steps: 2
  block_size: 256

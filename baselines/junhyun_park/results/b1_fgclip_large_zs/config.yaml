exp_id: junhyun_park/b1_fgclip_large_zs
build:
  script: baselines/junhyun_park/scripts/build_fgclip_submission.py
  repo: qihoo360/fg-clip-large
  transformers_pin: transformers==4.46.3
  extra_requirements: [einops==0.8.1, torchvision==0.29.2]
  fgclip_meta: {version: 1, walk_short_pos: true, max_length: 77}
inference:
  model_py: baselines/junhyun_park/submission/fgclip/model.py
  dtype: bfloat16
  image_batch: 128
  text_batch: 512
  dataloader_workers: 4   # min(8, cpu_count); Modal 컨테이너 cpu=4
run:
  script: baselines/junhyun_park/scripts/modal_run_fgclip.py
  runtime: Modal L4, cpu=4, memory=16GB, torch 2.15.0 (서버 gpu-requirements.txt 미고정 -> 빌드 시점 최신)
  data: 서버 haikuthon-dev-dataset (test 8,000 질의 / 15,000 후보)
scoring:
  script: baselines/junhyun_park/scripts/score_csv.py
  public: test id 7000-7999 (GUIDE.md 잠정), private: 나머지
